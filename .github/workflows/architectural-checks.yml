name: Architectural Boundary Enforcement

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # Check for forbidden patterns in code
  forbidden-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for unwrap() calls
        run: |
          echo "Checking for forbidden unwrap() calls..."
          if grep -r "\.unwrap()" --include="*.rs" csv-runtime/src csv-core/src; then
            echo "ERROR: Found unwrap() calls. Use proper error handling instead."
            exit 1
          fi
          
      - name: Check for expect() calls
        run: |
          echo "Checking for forbidden expect() calls..."
          if grep -r "\.expect(" --include="*.rs" csv-runtime/src csv-core/src; then
            echo "ERROR: Found expect() calls. Use proper error handling instead."
            exit 1
          fi
          
      - name: Check for todo!() macros
        run: |
          echo "Checking for forbidden todo!() macros..."
          if grep -r "todo!" --include="*.rs" csv-runtime/src csv-core/src; then
            echo "ERROR: Found todo!() macros. Implement the functionality instead."
            exit 1
          fi
          
      - name: Check for unsafe code
        run: |
          echo "Checking for unsafe blocks..."
          if grep -r "unsafe" --include="*.rs" csv-runtime/src csv-core/src; then
            echo "ERROR: Found unsafe code. This is forbidden in protocol logic."
            exit 1
          fi

  # Check for adapter-local decision points
  adapter-decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for adapter-local policy decisions
        run: |
          echo "Checking for adapter-local policy decisions..."
          # Check for patterns that indicate adapter-local decisions
          if grep -r "finality_depth\|retry_count\|rpc_fallback" --include="*.rs" csv-adapters; then
            echo "WARNING: Found potential adapter-local policy decisions."
            echo "Policy decisions should be centralized in runtime."
          fi
          
      - name: Check for adapter-local finality decisions
        run: |
          echo "Checking for adapter-local finality decisions..."
          if grep -r "is_finalized\|confirmations\|finality" --include="*.rs" csv-adapters | grep -v "verify_finality"; then
            echo "WARNING: Found potential adapter-local finality decisions."
            echo "Finality decisions should be centralized in runtime."
          fi

  # Check for replay protection violations
  replay-protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for check_then_consume anti-pattern
        run: |
          echo "Checking for check_then_consume anti-pattern..."
          # Look for patterns where replay check is separate from consumption
          if grep -r "is_consumed\|has_replay" --include="*.rs" csv-runtime/src | grep -A 5 "consume"; then
            echo "WARNING: Found potential check_then_consume anti-pattern."
            echo "Use consume_if_unconsumed for atomic replay protection."
          fi
          
      - name: Check for missing replay protection
        run: |
          echo "Checking for operations without replay protection..."
          # Look for mint operations without replay checks
          if grep -r "mint_sanad" --include="*.rs" csv-runtime/src | grep -v "replay\|consume"; then
            echo "WARNING: Found mint operations without explicit replay protection."
          fi

  # Check for lease ownership violations
  lease-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for operations without lease verification
        run: |
          echo "Checking for operations without lease verification..."
          # Look for mutating operations without lease checks
          if grep -r "lock_sanad\|mint_sanad" --include="*.rs" csv-runtime/src | grep -v "lease\|runtime_ctx"; then
            echo "WARNING: Found operations without lease verification."
            echo "All mutating operations must verify lease ownership."
          fi
          
      - name: Check for lease bypass attempts
        run: |
          echo "Checking for lease bypass attempts..."
          # Look for patterns that might bypass lease checks
          if grep -r "skip_lease\|bypass_lease\|ignore_lease" --include="*.rs" csv-runtime/src; then
            echo "ERROR: Found lease bypass attempts. This is forbidden."
            exit 1
          fi

  # Check for policy authority violations
  policy-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for adapter policy overrides
        run: |
          echo "Checking for adapter policy overrides..."
          if grep -r "override\|ignore\|bypass" --include="*.rs" csv-adapters | grep -i "policy"; then
            echo "ERROR: Found adapter policy override attempts."
            echo "Adapters must not override runtime policies."
            exit 1
          fi
          
      - name: Check for set_policy implementation
        run: |
          echo "Checking that adapters implement set_policy..."
          # Verify all adapters have set_policy method
          for adapter in csv-adapters/src/*.rs; do
            if ! grep -q "set_policy" "$adapter"; then
              echo "ERROR: Adapter $adapter missing set_policy implementation."
              exit 1
            fi
          done

  # Run clippy with architectural lints
  clippy-architectural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: clippy
          
      - name: Run clippy with architectural warnings
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::panic \
            -W clippy::indexing_slicing

  # Check for raw hashing in protocol logic
  raw-hashing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for raw hashing in protocol logic
        run: |
          echo "Checking for raw hashing in protocol logic..."
          # Look for direct hash calls in protocol logic (should use domain-separated hashing)
          if grep -r "sha256\|keccak\|blake" --include="*.rs" csv-core/src csv-runtime/src | grep -v "domain_separated\|Domain"; then
            echo "WARNING: Found raw hashing in protocol logic."
            echo "Use domain-separated hashing (DomainSeparatedHash) instead."
          fi

  # Summary report
  architectural-summary:
    runs-on: ubuntu-latest
    needs: [forbidden-patterns, adapter-decisions, replay-protection, lease-ownership, policy-authority, clippy-architectural, raw-hashing]
    if: always()
    steps:
      - name: Architectural Check Summary
        run: |
          echo "## Architectural Boundary Enforcement Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Forbidden Patterns | ${{ needs.forbidden-patterns.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Adapter Decisions | ${{ needs.adapter-decisions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Replay Protection | ${{ needs.replay-protection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lease Ownership | ${{ needs.lease-ownership.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Policy Authority | ${{ needs.policy-authority.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clippy Architectural | ${{ needs.clippy-architectural.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Raw Hashing | ${{ needs.raw-hashing.result }} |" >> $GITHUB_STEP_SUMMARY
