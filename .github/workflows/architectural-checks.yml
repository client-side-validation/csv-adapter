name: Architectural Boundary Enforcement

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # Check for forbidden patterns in code
  forbidden-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check for unwrap() calls in all production crates
        run: |
          echo "Checking for forbidden unwrap() calls in all production crates..."
          DIRS="csv-core/src csv-runtime/src csv-bitcoin/src csv-solana/src \
                csv-ethereum/src csv-aptos/src csv-sui/src csv-celestia/src \
                csv-sdk/src csv-cli/src"
          FOUND=0
          for dir in $DIRS; do
            if [ -d "$dir" ]; then
              if grep -r "\.unwrap()" --include="*.rs" "$dir" 2>/dev/null | grep -v "#\[cfg(test)\]" | grep -v "/tests/" | grep -v "/examples/"; then
                echo "ERROR: unwrap() found in $dir"
                FOUND=1
              fi
            fi
          done
          [ "$FOUND" -eq 0 ] || exit 1

      - name: Check for expect() calls in all production crates
        run: |
          echo "Checking for forbidden expect() calls in all production crates..."
          DIRS="csv-core/src csv-runtime/src csv-bitcoin/src csv-solana/src \
                csv-ethereum/src csv-aptos/src csv-sui/src csv-celestia/src \
                csv-sdk/src csv-cli/src"
          FOUND=0
          for dir in $DIRS; do
            if [ -d "$dir" ]; then
              if grep -r "\.expect(" --include="*.rs" "$dir" 2>/dev/null | grep -v "#\[cfg(test)\]" | grep -v "/tests/" | grep -v "/examples/"; then
                echo "ERROR: expect() found in $dir"
                FOUND=1
              fi
            fi
          done
          [ "$FOUND" -eq 0 ] || exit 1

      - name: Check for todo!() macros
        run: |
          echo "Checking for forbidden todo!() macros..."
          if grep -r "todo!" --include="*.rs" csv-runtime/src csv-core/src; then
            echo "ERROR: Found todo!() macros. Implement the functionality instead."
            exit 1
          fi

      - name: Check for unsafe code
        run: |
          echo "Checking for unsafe blocks..."
          if grep -r "unsafe" --include="*.rs" csv-runtime/src csv-core/src; then
            echo "ERROR: Found unsafe code. This is forbidden in protocol logic."
            exit 1
          fi

  # Check for adapter-local decision points
  adapter-decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for adapter-local policy decisions
        run: |
          echo "Checking for adapter-local policy decisions..."
          # Check for patterns that indicate adapter-local decisions
          if grep -r "finality_depth\|retry_count\|rpc_fallback" --include="*.rs" csv-bitcoin csv-ethereum csv-solana csv-sui csv-aptos; then
            echo "WARNING: Found potential adapter-local policy decisions."
            echo "Policy decisions should be centralized in runtime."
          fi
          
      - name: Check for adapter-local finality decisions
        run: |
          echo "Checking for adapter-local finality decisions..."
          if grep -r "is_finalized\|confirmations\|finality" --include="*.rs" csv-bitcoin csv-ethereum csv-solana csv-sui csv-aptos | grep -v "verify_finality"; then
            echo "WARNING: Found potential adapter-local finality decisions."
            echo "Finality decisions should be centralized in runtime."
          fi

  # Check for replay protection violations
  replay-protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for check_then_consume anti-pattern
        run: |
          echo "Checking for check_then_consume anti-pattern..."
          # Look for patterns where replay check is separate from consumption
          if grep -r "is_consumed\|has_replay" --include="*.rs" csv-runtime/src | grep -A 5 "consume"; then
            echo "WARNING: Found potential check_then_consume anti-pattern."
            echo "Use consume_if_unconsumed for atomic replay protection."
          fi
          
      - name: Check for missing replay protection
        run: |
          echo "Checking for operations without replay protection..."
          # Look for mint operations without replay checks
          if grep -r "mint_sanad" --include="*.rs" csv-runtime/src | grep -v "replay\|consume"; then
            echo "WARNING: Found mint operations without explicit replay protection."
          fi

  # Check for lease ownership violations
  lease-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for operations without lease verification
        run: |
          echo "Checking for operations without lease verification..."
          # Look for mutating operations without lease checks
          if grep -r "lock_sanad\|mint_sanad" --include="*.rs" csv-runtime/src | grep -v "lease\|runtime_ctx"; then
            echo "WARNING: Found operations without lease verification."
            echo "All mutating operations must verify lease ownership."
          fi
          
      - name: Check for lease bypass attempts
        run: |
          echo "Checking for lease bypass attempts..."
          # Look for patterns that might bypass lease checks
          if grep -r "skip_lease\|bypass_lease\|ignore_lease" --include="*.rs" csv-runtime/src; then
            echo "ERROR: Found lease bypass attempts. This is forbidden."
            exit 1
          fi

  # Check for policy authority violations
  policy-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for adapter policy overrides
        run: |
          echo "Checking for adapter policy overrides..."
          if grep -r "override\|ignore\|bypass" --include="*.rs" csv-bitcoin csv-ethereum csv-solana csv-sui csv-aptos | grep -i "policy"; then
            echo "ERROR: Found adapter policy override attempts."
            echo "Adapters must not override runtime policies."
            exit 1
          fi

  # Run clippy with architectural lints
  clippy-architectural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: clippy
          
      - name: Run clippy with architectural warnings
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::panic \
            -W clippy::indexing_slicing

  # Check for raw hashing in protocol logic
  raw-hashing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check for raw hashing in core/runtime/sdk
        run: |
          echo "Checking for raw hashing in core/runtime/sdk..."
          # Sha256::digest / Keccak256::digest must not appear outside adapter raw_hash()
          if grep -r --include="*.rs" 'Sha256::digest\|Keccak256::digest' \
             csv-core/src csv-runtime/src csv-sdk/src 2>/dev/null | \
             grep -v "raw_hash\|test\|#\[cfg(test)\]"; then
            echo "ERROR: Raw hashing found in core/runtime/sdk — use csv_tagged_hash()"
            exit 1
          fi

      - name: Check for raw hashing in adapters (must use domain separation)
        run: |
          echo "Checking for raw hashing in adapters..."
          # Adapters should use CrossChainHashAlgorithm::hash_bytes_domain() for cross-chain ops
          if grep -r --include="*.rs" 'Sha256::digest\|Keccak256::digest' \
             csv-bitcoin/src csv-solana/src csv-ethereum/src csv-sui/src csv-aptos/src 2>/dev/null | \
             grep -v "raw_hash\|test\|#\[cfg(test)\]\|proof_bytes\|merkle"; then
            echo "WARNING: Raw hashing found in adapters — ensure domain separation is used."
          fi

  # WASM build verification
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
      
      - name: Build csv-core for wasm32 (no_std compatible)
        run: cargo build --package csv-core --no-default-features --features "std" --target wasm32-unknown-unknown

  # MCP contract checks
  mcp-contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no direct adapter imports from MCP server
        run: |
          if grep -r "csv-bitcoin\|csv-ethereum\|csv-solana\|csv-sui\|csv-aptos" \
             csv-mcp-server/src --include="*.ts"; then
            echo "ERROR: MCP server must not import chain adapters directly."
            exit 1
          fi

      - name: Verify VerificationLevel is always checked in test fixtures
        run: |
          # Ensure test files check verification_level, not just is_valid
          if grep -l "is_valid" csv-mcp-server/tests --include="*.ts" -r | \
             xargs grep -L "verification_level"; then
            echo "WARNING: Tests checking is_valid without verification_level."
          fi

      - name: Verify no serde_json in canonical hashing paths
        run: |
          if grep -rn "serde_json::to_vec\|serde_json::to_string" \
             --include="*.rs" csv-core/src csv-runtime/src | \
             grep -v "//\|#\[cfg(test)\]"; then
            echo "ERROR: serde_json in protocol path. Use canonical_cbor."
            exit 1
          fi

      - name: Verify audit log present in MCP server
        run: |
          if ! grep -q "auditLog" csv-mcp-server/src/index.ts 2>/dev/null; then
            echo "ERROR: transfer_sanad must emit audit log."
            exit 1
          fi

      - name: TypeScript compilation check
        run: |
          cd csv-mcp-server
          npm ci 2>/dev/null || true
          npx tsc --noEmit 2>/dev/null || echo "TypeScript check skipped (dependencies may not be installed)"

  # Summary report
  architectural-summary:
    runs-on: ubuntu-latest
    needs: [forbidden-patterns, adapter-decisions, replay-protection, lease-ownership, policy-authority, clippy-architectural, raw-hashing, mcp-contract-checks]
    if: always()
    steps:
      - name: Architectural Check Summary
        run: |
          echo "## Architectural Boundary Enforcement Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Forbidden Patterns (all crates) | ${{ needs.forbidden-patterns.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Adapter Decisions | ${{ needs.adapter-decisions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Replay Protection | ${{ needs.replay-protection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lease Ownership | ${{ needs.lease-ownership.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Policy Authority | ${{ needs.policy-authority.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clippy Architectural | ${{ needs.clippy-architectural.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Raw Hashing (domain separation) | ${{ needs.raw-hashing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MCP Contract Checks | ${{ needs.mcp-contract-checks.result }} |" >> $GITHUB_STEP_SUMMARY
