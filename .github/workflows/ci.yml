name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ── Build & Test ──────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build (all features)
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Run doc tests
        run: cargo test --workspace --doc

  # ── Lint & Format ─────────────────────────────────────────────
  lint:
    name: Clippy & rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Verify fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml

  # ── RLP Encoding Regression Tests ───────────────────────────────
  rlp-tests:
    name: RLP Encoding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run RLP encoding tests
        run: cargo test --package csv-wallet test_eth_rlp -- --nocapture
        env:
          ETH_CHAIN_ID: "11155111"

  # ── Audit Dependencies ────────────────────────────────────────
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit

  # ── Fuzz Testing ──────────────────────────────────────────────
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run fuzz targets with corpus
        run: |
          cd fuzz
          # Run each fuzz target for a short duration with corpus
          cargo fuzz run proof_bundle_decode -- -max_total_time=60 fuzz_targets/proof_bundle_decode/corpus || true
          cargo fuzz run consignment_decode -- -max_total_time=60 fuzz_targets/consignment_decode/corpus || true
          cargo fuzz run finality_parser -- -max_total_time=60 fuzz_targets/finality_parser/corpus || true
          cargo fuzz run abi_decoder -- -max_total_time=60 fuzz_targets/abi_decoder/corpus || true
          cargo fuzz run rpc_parser -- -max_total_time=60 fuzz_targets/rpc_parser/corpus || true

  # ── WASM32 Build Check ──────────────────────────────────────────
  # Ensures csv-wallet and csv-runtime compile for wasm32-unknown-unknown
  # Every PR changing Cargo.toml must pass this job
  wasm32-check:
    name: WASM32 Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build csv-runtime for wasm32 (no persistent feature)
        run: cargo build --package csv-runtime --no-default-features --target wasm32-unknown-unknown

      - name: Build csv-wallet for wasm32 (native feature disabled)
        run: cargo build --package csv-wallet --no-default-features --features "csv-bitcoin,csv-ethereum" --target wasm32-unknown-unknown

      - name: Build csv-core for wasm32
        run: cargo build --package csv-core --target wasm32-unknown-unknown

      - name: Verify csv-runtime rejects persistent on wasm32
        run: |
          ! cargo build --package csv-runtime --features persistent --target wasm32-unknown-unknown 2>&1 | grep -q "compile_error" || exit 0
          # The compile_error! should fire — we expect this to fail
          cargo build --package csv-runtime --features persistent --target wasm32-unknown-unknown 2>&1 | grep -q "persistent.*wasm32"

  # ── Golden Proof Corpus Validation ──────────────────────────────
  # Validates that all golden CBOR fixtures can be deserialized
  # and that the canonical_hash function produces deterministic output
  golden-corpus:
    name: Golden Corpus Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run golden corpus tests
        run: cargo test -p csv-core --test golden

      - name: Verify golden fixtures exist
        run: |
          test -f csv-core/tests/golden/valid_proof_bundle_v1.cbor
          test -f csv-core/tests/golden/valid_sanad_envelope_v1.cbor
          test -f csv-core/tests/golden/replay_attempt_v1.cbor
          test -f csv-core/tests/golden/malformed_proof_missing_finality.cbor
          test -f csv-core/tests/golden/malformed_proof_wrong_domain.cbor

      - name: Verify threat model exists
        run: test -f docs/THREAT_MODEL.md

      - name: Verify contract manifest exists
        run: test -f deployments/contract-manifest.json

  # ── Architectural Boundary Enforcement ──────────────────────────
  # Enforces AGENT.md rules: no unwrap/expect/unsafe in critical paths,
  # no direct adapter calls from core, no fake crypto, no fallback logic
  architectural-checks:
    name: Architectural Boundary Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for unwrap() in csv-core (forbidden in production code)
        run: |
          ! grep -r "\.unwrap()" csv-core/src/ --include="*.rs" || exit 1
        continue-on-error: false

      - name: Check for expect() in csv-core (forbidden in production code)
        run: |
          ! grep -r "\.expect(" csv-core/src/ --include="*.rs" || exit 1
        continue-on-error: false

      - name: Check for unsafe blocks in csv-core (forbidden except in crypto primitives)
        run: |
          ! grep -r "unsafe {" csv-core/src/ --include="*.rs" || exit 1
        continue-on-error: false

      - name: Check for direct adapter imports in csv-core (architectural boundary violation)
        run: |
          ! grep -r "csv-bitcoin\|csv-ethereum\|csv-solana\|csv-aptos\|csv-sui\|csv-celestia" csv-core/src/ --include="*.rs" || exit 1
        continue-on-error: false

      - name: Check for TODO/FIXME placeholders (forbidden in production code)
        run: |
          ! grep -r "TODO\|FIXME" csv-core/src/ --include="*.rs" || exit 1
        continue-on-error: false

      - name: Check for fake crypto patterns (forbidden)
        run: |
          ! grep -r "fake\|placeholder\|stub.*crypto\|mock.*proof" csv-core/src/ --include="*.rs" || exit 1
        continue-on-error: false

      - name: Check for fallback logic in adapters (forbidden per AUDIT.md)
        run: |
          ! grep -r "fallback\|retry.*different\|alternative.*rpc" csv-bitcoin/src/ csv-ethereum/src/ csv-solana/src/ --include="*.rs" || exit 1
        continue-on-error: false
