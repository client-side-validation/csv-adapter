[package]
name = "csv-wallet"
version = "0.5.0"
edition = "2024"
description = "Standalone multi-chain wallet for CSV Protocol with Dioxus UI"
license = "MIT OR Apache-2.0"
authors = ["Amin Razavi"]
repository = "https://github.com/client-side-validation/csv-protocol"
homepage = "https://github.com/client-side-validation/csv-protocol"
readme = "README.md"
publish = false

[[bin]]
name = "csv-wallet"
path = "src/main.rs"

[dependencies]
# Core CSV Protocol types
csv-core = { path = "../csv-core", default-features = false, features = ["std"] }
csv-store = { path = "../csv-store", default-features = false, features = ["browser-storage", "encrypted-storage"] }
csv-keys = { path = "../csv-keys", features = ["wasm", "production"] }

# Dioxus UI
dioxus = { version = "0.7", features = ["web", "router"] }

# Cryptography - wasm compatible
getrandom = { workspace = true }
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
hex = "0.4.3"
bs58 = "0.5"
rand = { version = "0.8", features = ["std"] }
bip32 = { version = "0.5", features = ["std", "mnemonic"] }
bitcoin = { version = "0.32", default-features = false, features = ["serde", "rand-std", "std"] }

# Ethereum RLP encoding
rlp = "0.5"
ethereum-types = "0.14"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }

# Async utilities
futures = "0.3"
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde", "js"] }

# Web/wasm
console_error_panic_hook = "0.1"
web-sys = { workspace = true, features = ["Window", "Storage", "Document", "Element", "HtmlInputElement", "FileReader", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "File", "FileList", "ProgressEvent", "Navigator", "DataTransfer", "Event", "DragEvent", "Clipboard", "Request", "RequestInit", "RequestMode", "RequestCredentials", "Headers", "Response"] }
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.70"
gloo-timers = { workspace = true, features = ["futures"] }
serde-wasm-bindgen = "0.6"

# BCS encoding
bcs = "0.1"

# Base64 for Solana
base64 = "0.21"

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
csv-runtime = { path = "../csv-runtime", optional = true }
csv-sdk = { path = "../csv-sdk", features = ["bitcoin", "tokio", "wallet"] }
tokio = { version = "1.0", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.20", optional = true }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
dirs = "5.0"
csv-bitcoin = { path = "../csv-bitcoin", optional = true }
csv-ethereum = { path = "../csv-ethereum", optional = true }

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
csv-sdk = { path = "../csv-sdk", default-features = false, features = ["wasm"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
serial_test = "3.0"

[features]
default = ["native"]
native = ["dep:csv-runtime", "dep:reqwest", "dep:tokio-tungstenite"]
csv-bitcoin = ["dep:csv-bitcoin", "csv-sdk/bitcoin"]
csv-ethereum = ["dep:csv-ethereum"]