[package]
name = "csv-runtime"
version = "0.1.0"
edition = "2021"
description = "CSV Protocol runtime orchestration engine"
license = "MIT OR Apache-2.0"

[dependencies]
csv-core = { path = "../csv-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"
rocksdb = { version = "0.21", optional = true }
hakari = { version = "0.1", path = "../hakari" }

# Native: full tokio (net, fs, io-util, etc.)
# WASM: rt + macros + sync + time only (no net — mio is unsupported on wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

[features]
default = ["persistent"]
persistent = ["dep:rocksdb"]
serde = []
