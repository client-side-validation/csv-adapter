[package]
name = "csv-stark"
version = "0.5.0"
edition = "2024"
description = "STARK batch verification for IoT sensor streams in the CSV protocol"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
csv-core = { path = "../csv-core" }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
thiserror = "1.0"
bincode = "1.3"

[features]
default = []
# Enable the mock/stub prover and verifier for development and testing.
# SECURITY: Must NOT be used in production builds.
dev-stark = []
# Enable real SP1 integration when available (pending implementation).
sp1 = []

[dev-dependencies]
rand = "0.8"
